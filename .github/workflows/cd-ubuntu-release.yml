name: CD Ubuntu (Ninja + GHCR)

on:
  push:
    tags:
      - 'v*'

env:
  CMAKE_GENERATOR: Ninja

jobs:
  # ====================================================================
  # Construct the Docker image and push it to GHCR
  # ====================================================================
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connect to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/ubuntu-gcc
          tags: |
            type=raw,value=latest
      - name: Build and Push the Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/debian/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================================
  # Build, Package DEB, and Release
  # ====================================================================
  build-and-release:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container: ${{ needs.build-docker.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake Project
        run: |
          HALIDE_DIR=$(python3 -c 'import halide, os; print(os.path.dirname(halide.__file__))')
          echo "HALIDE_DIR=$HALIDE_DIR"

          cmake \
          --preset release-ninja-linux \
          -DBUILD_DESKTOP_UI:BOOL=ON \
          -Dtests=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DHALIDE_DIR="${HALIDE_DIR}" \
          -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2"
        shell: bash

      - name: Build Project
        run: |
          cmake --build build/release-ninja-linux --config Release --parallel $(nproc)
        shell: bash

      - name: Verify build output
        run: |
          if [ ! -f build/release-ninja-linux/CaptureMoment ]; then
            echo "::error::CaptureMoment not found in build dir"
            find build/release-ninja-linux -maxdepth 2 -type f -executable | head
            exit 1
          fi
          ldd build/release-ninja-linux/CaptureMoment | grep "not found" && \
            echo "::error::Unresolved libraries!" && exit 1 || true
          echo "Build OK"
        shell: bash

      - name: Upload executable to Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/release-ninja-linux/CaptureMoment
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
