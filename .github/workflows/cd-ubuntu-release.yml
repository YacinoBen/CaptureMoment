name: CD Ubuntu (Ninja + GHCR)

on:
  push:
    tags:
      - 'v*'

env:
  CMAKE_GENERATOR: Ninja

jobs:
  # ====================================================================
  # Construct the Docker image and push it to GHCR
  # ====================================================================
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connect to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ubuntu-gcc
          tags: |
            type=raw,value=latest
      - name: Build and Push the Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/debian/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================================
  # Build, Package DEB, and Release
  # ====================================================================
  build-and-release:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container: ${{ needs.build-docker.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake Project
        run: |
          HALIDE_DIR=$(python3 -c 'import halide; print(halide.cmake_dir())')
          cmake \
          --preset release-ninja-linux \
          -DBUILD_DESKTOP_UI:BOOL=ON \
          -Dtests=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DHALIDE_DIR="${HALIDE_DIR}" \
          -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2"
        shell: bash

      - name: Build Project
        run: |
          cmake --build build/release-ninja-linux --config Release --parallel $(nproc)
        shell: bash

      - name: Package DEB via CPack
        run: |
          cd build/release-ninja-linux
          cpack -G DEB -C Release

      - name: Verify DEB dependencies
        run: |
          DEB_FILE=$(ls build/release-ninja-linux/*.deb | head -1)
          echo "Checking dependencies for $DEB_FILE"
          dpkg-deb -I "$DEB_FILE" | grep -q "libQt6" || (echo "::error::DEB is missing Qt runtime dependencies!" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release-ninja-linux/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
