name: CI Windows (vcpkg + MSVC)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70

    strategy:
      matrix:
        build-type: [Release, Debug]
        include:
          - build-type: Release
            preset: release-vcpkg-msvc
          - build-type: Debug
            preset: debug-vcpkg-msvc

    steps:
      # ====================================================================
      # Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ====================================================================
      # Update Chocolatey and install dependencies
      # ====================================================================
      - name: Choco - Install CMake
        run: choco upgrade cmake.install -y
      - name:  Choco - Install Visual MSVC 2026
        run: choco install visualstudio2026community --version=118.2.1 -y

      # ====================================================================
      # Setup Qt
      # ====================================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
         version: '6.10.2'
         target: 'desktop'
         arch: 'win64_msvc2022_64'
         modules: 'qtshadertools'

      # ====================================================================
      # Setup vcpkg
      # ====================================================================
      - name: Setup vcpkg (latest)
        run: |
          # if vcpkg is already installed, we use it, otherwise we clone it and bootstrap it
          $vcpkgCmd = Get-Command vcpkg -ErrorAction SilentlyContinue
          
          if ($vcpkgCmd) {
            Write-Host "vcpkg detected, using existing installation..."
            # We get the path to the vcpkg root directory from the command
            $vcpkgRoot = (Get-Item $vcpkgCmd.Source).DirectoryName
          } else {
            Write-Host "vcpkg not detected, cloning..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            $vcpkgRoot = "C:\vcpkg"
          }
          
          # In both cases, we run the bootstrap script with the correct path
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          
          # We configure the environment variables dynamically
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "$vcpkgRoot" >> $env:GITHUB_PATH
      # ====================================================================
      # Setup Python and install Halide via pip
      # ====================================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
  
      - name: pip halide
        run: |
         pip install halide
    
      # ====================================================================
      # Configure & Build with CMake
      # ====================================================================
      - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.preset }}'
          configurePresetAdditionalArgs: "['-Ddesktop_ui=ON','-Dtests=OFF']" # Turn On Tests afters
          buildPreset: '${{ matrix.preset }}'
          buildPresetAdditionalArgs: "['--config ${{ matrix.build-type }}']"
        # testPreset: '${{ matrix.preset }}'
        # testPresetAdditionalArgs: "['--config ${{ matrix.build-type }}', '--output-on-failure']"

      # ====================================================================
      # Upload build artifacts
      # ====================================================================
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.build-type }}
          path: |
            build/ui/desktop/${{ matrix.build-type }}/*.exe
            build/tests/${{ matrix.build-type }}/*.exe
            build/${{ matrix.build-type }}/*.lib
            build/${{ matrix.build-type }}/*.dll
          retention-days: 7
          if-no-files-found: ignore
